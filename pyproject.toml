[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dita-migration-agent"
version = "2.0.0"
description = "Autonomous AI agent for fixing AsciiDoc files to DITA compatibility"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
authors = [
    {name = "DITA Migration Team"}
]
keywords = ["dita", "asciidoc", "documentation", "migration", "ai", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "openai>=1.0.0",
    "httpx>=0.25.0",
    "pyyaml>=6.0",
    "rich>=13.0.0",
    "click>=8.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
dita-agent = "dita_agent.cli:main"

[project.urls]
Homepage = "https://github.com/gtrivedi88/dita-migration-agent"
Repository = "https://github.com/gtrivedi88/dita-migration-agent"

[tool.setuptools.packages.find]
where = ["."]
include = ["dita_agent*"]

[tool.setuptools.package-data]
dita_agent = ["certs/*.pem"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]
